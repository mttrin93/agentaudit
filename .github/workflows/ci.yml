name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Lint, typecheck and tests read the tree and write nothing back.
permissions:
  contents: read

# A second push to the same ref makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to a patch tag: setup-uv publishes no floating v10.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # The lockfile decides the versions, so a green run here means the same
      # versions a local run used.
      - name: Install the project
        run: uv sync --all-groups --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      # The suite serves the reference agents over real HTTP on an ephemeral
      # port; nothing here reaches the network or a model provider.
      - name: Test
        run: uv run pytest -q
