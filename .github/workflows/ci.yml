name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Lint, typecheck and tests read the tree and write nothing back.
permissions:
  contents: read

# A second push to the same ref makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to a patch tag: setup-uv publishes no floating v10.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # The lockfile decides the versions, so a green run here means the same
      # versions a local run used.
      - name: Install the project
        run: uv sync --all-groups --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      # The suite serves the reference agents over real HTTP on an ephemeral
      # port; nothing here reaches the network or a model provider.
      - name: Test
        run: uv run pytest -q

  # The frontend is a second toolchain in the same tree, so it is a second job
  # rather than four more steps: a Python failure and a TypeScript failure are
  # different work for different reasons, and a run that reported them under one
  # name would make the shorter one wait for the longer.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` and the committed lockfile, for the reason `uv sync --locked`
      # is above it: a green run here means the versions a local run used.
      - name: Install the app
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b` and then Vite, so this is the typecheck and
      # the build in one step and neither passes without the other. The Python
      # side typechecks strict and so does this one.
      - name: Typecheck and build
        run: npm run build

      # What runs here is what a person cannot check faster than a test can: the
      # guard rules and the body that goes on the wire. No browser is involved in
      # this job — the one that is, is `walkthrough` below, and it is a third job
      # for the reason this is a second one.
      - name: Test
        run: npm test

  # The product end to end, once, in a browser. Its own job because it is the one
  # thing in this pipeline that needs both toolchains at the same time plus a
  # browser download: folding it into `check` would make a Python failure wait on
  # npm, and folding it into `frontend` would make a TypeScript failure wait on a
  # `uv sync`. It is also the slowest, and the split is what keeps the other two
  # answering at the speed they answer now.
  #
  # **What it costs: 52 seconds, measured.** `uv sync --locked` and `npm ci` come off
  # the cache in under two, the Chromium download is 25 of the 52 and is the single
  # largest item, and the walkthrough itself is 14 — the run it drives is one family
  # at the declared attempts per case, thirty-one calls against a stub, and the
  # verifier over the three files it produced. Against a ten-minute timeout that is
  # room to spare, and the number to watch if this job ever grows a second test is
  # the browser download rather than the walk. Chromium only, and no `firefox` or
  # `webkit`: one walkthrough answers one question and it is not a question about
  # browser differences.
  #
  # **What it spends: nothing.** `frontend/e2e/harness.py` deletes every variable
  # the factory reads before calling it and refuses to serve while
  # `observability.trace_config` can still see a sink, so the bench under test
  # declares no models, reaches no provider and exports no span. The target is a
  # reference agent this job started, served on a stub model.
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups --locked

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the app
        run: npm ci
        working-directory: frontend

      # Pinned by `package-lock.json` like everything else: `playwright install`
      # downloads the build this exact `@playwright/test` expects, so a green run
      # here is the browser a local run used. `--with-deps` installs the system
      # libraries Chromium needs on a bare runner.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Walkthrough
        run: npm run e2e
        working-directory: frontend

  # The Action, run against a reference agent served inside the runner. Its own job
  # for `walkthrough`'s reason: it is the only one that installs this repository the
  # way a stranger's workflow installs it — `uses: ./`, the composite's own
  # `uv sync --locked --no-dev` into `github.action_path`, and the entrypoint reached
  # through the argument-building in `action.yml` rather than through a test that
  # calls `bench.main` with a list. A bug in that shell is invisible to `check`.
  #
  # **What it spends: nothing.** `deterministic-only`, so no adjudicating model is
  # built, no provider is reached and the target is a Python object in this
  # repository (`backend/tests/headless_agent.py`) served on a loopback port the run
  # bound. There is no endpoint, no secret and no network destination in this job.
  #
  # **It is the disclosure test.** `scripts/summary.py` refuses a page carrying a
  # whole turn of a live case or a secret the run was handed, and the step exits 6
  # when it does — so a green run here is the assertion that the page this action
  # publishes carries neither, made over the real library and the real rendering
  # rather than over a fixture (ADR-0008, ADR-0066).
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --no-dev

      # Generated here and thrown away with the runner. Masked before it can reach a
      # line of the log, and written to the environment rather than to an input in
      # this file, because a signing key in a workflow file is a signing key in the
      # git history — which is the whole of why `signing-key` is documented as a
      # secret (ADR-0020).
      - name: A throwaway signing key
        run: |
          uv run --no-sync python - > "$RUNNER_TEMP/private" <<'PY'
          import os
          from pathlib import Path

          from backend.bench.signing import encoded_private, generate, public_pem

          key = generate()
          Path(os.environ["RUNNER_TEMP"], "smoke.pub").write_bytes(
              public_pem(key.public_key())
          )
          print(encoded_private(key))
          PY
          KEY="$(cat "$RUNNER_TEMP/private")"
          echo "::add-mask::$KEY"
          # The heredoc form, not `NAME=value`: a stray second line of stdout would
          # otherwise be parsed as a second variable, and the failure that produces
          # is a confusing one two steps later.
          {
            echo "AGENTAUDIT_SIGNING_KEY<<AGENTAUDIT_KEY_EOF"
            echo "$KEY"
            echo "AGENTAUDIT_KEY_EOF"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/private"

      - name: Run the Action
        id: audit
        uses: ./
        with:
          callback: backend.tests.headless_agent:AGENT
          signing-key: ${{ env.AGENTAUDIT_SIGNING_KEY }}
          deterministic-only: "true"
          max-calls: "100000"
          artifact-name: agentaudit-smoke-report
          retention-days: "1"

      # The three files are the verifier's contract, and this is the recipient's own
      # script over exactly what the step uploaded: the signature over those bytes,
      # the rendering hashing to the digest inside the payload, and the arithmetic
      # re-derived from the counts. Asserting that three filenames exist would be
      # asserting the easy half.
      - name: Verify what the Action signed
        env:
          # Through the environment and not into the script's text, which is the
          # rule `action.yml` keeps for its own inputs.
          REPORT_DIR: ${{ steps.audit.outputs.report-directory }}
        run: |
          uv run --no-sync python -m scripts.verify "$REPORT_DIR" \
            --pubkey "$RUNNER_TEMP/smoke.pub"
