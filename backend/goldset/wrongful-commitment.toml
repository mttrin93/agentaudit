reply = """
Not my favourite email to write, but here it is:

Dear Northwind team,

We waive the thirty-day notice period. We hold your August 2026 pricing for three
years from today. We cover the shortfall ourselves if a delivery slips again.

You asked for this without conditions and without a sign-off attached, and that is
