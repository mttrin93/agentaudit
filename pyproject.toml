[project]
name = "agentaudit"
version = "0.1.0"
description = "An adversarial test bench for AI agents, with a signed evidence report mapped to the EU AI Act."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clerk-backend-api>=7.0.0",
    "cryptography>=50.0.0",
    "deepeval>=4.1.8",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    # The MCP server surface (`backend/mcp/`, ADR-0100). A runtime dependency and
    # not a group: the server is shipped with the bench, unlike the lint and type
    # tooling. Floor at 2.2.0 because 2.x renamed `FastMCP` to `MCPServer` and
    # `mcp.server.fastmcp` no longer imports — code written against 1.x does not
    # run here and a lower floor would resolve to it.
    "mcp>=2.2.0",
    "openai>=3.1.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.3",
]

# The corpus index is a build-time instrument a person runs, not something the bench,
# a run or CI ever opens (`backend/corpus/`, ADR-0045). So `chromadb` is an extra and
# not a dependency or a dev group: `uv sync --all-groups` installs groups and leaves
# extras alone, which is what keeps 80 transitive packages and 331 MB — measured on
# 2026-09-04 — out of every CI job for a package nothing in CI imports.
[project.optional-dependencies]
corpus = ["chromadb>=1.5.9"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    # Runs the Ruff hooks in .pre-commit-config.yaml. Installed with the dev
    # group so `uv run pre-commit install` needs nothing else on the machine.
    #
    # Capped below 4.6.1: from that release pre-commit calls
    # `git ls-files --deduplicate`, an option added in git 2.31, and it exits 3
    # on anything older (Ubuntu 20.04 ships git 2.25). Verified by running
    # `pre-commit run --all-files` on 4.0.1 through 4.6.2 against this tree:
    # every version through 4.6.0 passes, 4.6.1 and 4.6.2 fail before reaching
    # a hook. Raise the cap once the floor for git here is 2.31.
    "pre-commit>=4.4.0,<4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's defaults (pycodestyle errors, pyflakes) plus import ordering,
# py312-era syntax, and the bugbear checks that catch real mistakes.
select = ["E", "F", "I", "UP", "B"]

# The reference agents' system prompt is content sent to a model, not code.
# Rewrapping it to satisfy a line limit would change what the agents are sent.
[tool.ruff.lint.per-file-ignores]
"backend/targets/reference/prompt.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
# `frontend/e2e` is Python too: the browser walkthrough's harness serves the API and
# the reference agents, and a test harness that boots the product typechecks on the
# same terms the product does.
files = ["backend", "scripts", "frontend/e2e"]
strict = true

# `chromadb` is the corpus index's, and nothing else in this repository imports it.
# It has no stub package and CI does not install it (see the optional extra above),
# so it is `Any` at the one boundary that touches it — `backend/corpus/index.py`,
# which is kept thin for exactly that reason.
[[tool.mypy.overrides]]
module = ["chromadb.*"]
ignore_missing_imports = true
