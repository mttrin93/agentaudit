[project]
name = "agentaudit"
version = "0.1.0"
description = "An adversarial test bench for AI agents, with a signed evidence report mapped to the EU AI Act."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.1.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.mypy]
python_version = "3.12"
files = ["backend", "scripts"]
strict = true
