[project]
name = "agentaudit"
version = "0.1.0"
description = "An adversarial test bench for AI agents, with a signed evidence report mapped to the EU AI Act."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "deepeval>=4.1.8",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "openai>=3.1.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    # Runs the Ruff hooks in .pre-commit-config.yaml. Installed with the dev
    # group so `uv run pre-commit install` needs nothing else on the machine.
    #
    # Capped below 4.6.1: from that release pre-commit calls
    # `git ls-files --deduplicate`, an option added in git 2.31, and it exits 3
    # on anything older (Ubuntu 20.04 ships git 2.25). Verified by running
    # `pre-commit run --all-files` on 4.0.1 through 4.6.2 against this tree:
    # every version through 4.6.0 passes, 4.6.1 and 4.6.2 fail before reaching
    # a hook. Raise the cap once the floor for git here is 2.31.
    "pre-commit>=4.4.0,<4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's defaults (pycodestyle errors, pyflakes) plus import ordering,
# py312-era syntax, and the bugbear checks that catch real mistakes.
select = ["E", "F", "I", "UP", "B"]

# The reference agents' system prompt is content sent to a model, not code.
# Rewrapping it to satisfy a line limit would change what the agents are sent.
[tool.ruff.lint.per-file-ignores]
"backend/targets/reference/prompt.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["backend", "scripts"]
strict = true
